<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Invoice - SupplierPro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        :root {
            /* Shared font-size between header info & product table */
            --invoice-header-font-size: 9pt;
            --invoice-header-line-height: 1.2;
            --invoice-table-font-size: var(--invoice-header-font-size);
            --invoice-table-line-height: 1.25;
            --invoice-table-pad-y: 3px;
            --invoice-table-pad-x: 6px;
        }

        /* Screen: center the invoice cards */
        body {
            background: #f3f4f6;
            margin: 0;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #print-invoice-view {
            display: block !important;
            position: relative !important;
            inset: auto !important;
            width: 24.13cm;
            max-width: 24.13cm;
            box-sizing: border-box;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        /* Each printed page container */
        .invoice-page {
            background: white;
            width: 24.13cm;
            max-width: 24.13cm;
            padding: 1.5rem 2rem;
            box-sizing: border-box;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            margin-bottom: 2rem;
            position: relative;
        }

        /* Header info text styles */
        .invoice-header-info {
            font-size: var(--invoice-header-font-size);
            line-height: var(--invoice-header-line-height);
            color: #000;
        }
        .invoice-header-info table {
            font-size: var(--invoice-header-font-size);
            line-height: var(--invoice-header-line-height);
        }

        /* Compact header strip on continuation pages */
        .invoice-compact-header-wrap {
            margin-bottom: 0.35rem;
            color: #000;
        }
        .invoice-compact-strip {
            font-size: var(--invoice-header-font-size);
            font-weight: bold;
            line-height: 1.2;
            color: #000;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .invoice-continuation-note {
            font-size: 8pt;
            font-style: italic;
            color: #000;
            margin-top: 2px;
        }

        /* Product items table */
        .invoice-items-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0.35rem;
            font-size: var(--invoice-table-font-size);
            line-height: var(--invoice-table-line-height);
            color: #000;
        }
        .invoice-items-table thead {
            display: table-header-group;
        }
        .invoice-items-table tbody tr {
            break-inside: avoid;
            page-break-inside: avoid;
            height: auto;
            min-height: 0;
        }
        .invoice-items-table th,
        .invoice-items-table td {
            border: 1px solid #000;
            padding: var(--invoice-table-pad-y) var(--invoice-table-pad-x);
            height: auto;
            min-height: 0;
            box-sizing: border-box;
            vertical-align: middle;
        }
        .invoice-items-table th {
            font-weight: bold;
        }
        .invoice-items-table td {
            font-weight: normal;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Continuation indicator */
        .invoice-bersambung {
            text-align: right;
            font-size: 8pt;
            font-style: italic;
            margin-top: 2px;
            margin-bottom: 2px;
            color: #000;
        }

        /* Bottom (signatures + totals) */
        .invoice-bottom {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .invoice-signatures,
        .invoice-totals {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        /* Page footer */
        .invoice-page-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8pt;
            margin-top: 0.25rem;
            color: #000;
        }

        /* Print: clean page for continuous form dot matrix (Epson LQ-590) */
        @media print {
            :root {
                --print-content-width: 19.5cm;  /* LQ-590 printable area ~20.3cm; safety margin */
                --print-offset-left: 0cm;
            }
            html, body {
                background: white !important;
                width: auto !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                display: block !important;
                overflow: visible !important;
            }
            /* Cancel dashboard.css overrides that hide everything */
            body > *:not(.dashboard-wrapper),
            .sidebar, .topbar, .sidebar-overlay, .modal-overlay, .page-section, .page-toolbar {
                display: revert !important;
            }
            #print-invoice-view {
                display: block !important;
                position: static !important;
                inset: auto !important;
                width: 100% !important;
                max-width: var(--print-content-width) !important;
                margin-left: var(--print-offset-left) !important;
                margin-right: 0 !important;
                height: auto !important;
                min-height: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                box-shadow: none !important;
                box-sizing: border-box !important;
            }
            .invoice-page {
                display: block !important;
                background: white !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: var(--print-content-width) !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
                min-height: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                box-sizing: border-box !important;
                overflow: visible !important;
            }
            .invoice-page.is-last-page,
            .invoice-page:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .invoice-items-table {
                table-layout: fixed;
                width: 100% !important;
            }
            .invoice-items-table thead {
                display: table-header-group !important;
            }
            .invoice-items-table tbody tr {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .invoice-bottom {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .invoice-signatures,
            .invoice-totals {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="print-invoice-view">
        <!-- Actions (Not printed) -->
        <div class="no-print actions-bar">
            <button class="btn-toolbar secondary" onclick="closePrintTab()">Tutup</button>
            <button class="btn-toolbar primary" onclick="window.print()"><i data-lucide="printer"></i> Cetak / Print</button>
        </div>

        <!-- Rendered invoice pages (1 or multiple pages) -->
        <div id="print-pages-container">
            <div style="text-align: center; padding: 3rem; color: #6b7280;">Memuat invoice...</div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" style="position: fixed; top: 1rem; right: 1rem; z-index: 99999; display: flex; flex-direction: column; gap: 0.5rem;"></div>

    <script src="invoice-print.js"></script>
</body>
</html>
