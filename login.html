<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SupplierPro</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --gray-100: #f3f4f6;
            --gray-300: #d1d5db;
            --gray-700: #374151;
            --white: #ffffff;
            --danger: #ef4444;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--blue-600);
            margin-bottom: 2rem;
            text-decoration: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--gray-700);
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--blue-600);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--blue-600);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--blue-700);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .hint {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--gray-700);
            background: var(--gray-100);
            padding: 1rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="logo">
            <i data-lucide="boxes"></i>
            SupplierPro
        </a>
        <h2>Masuk ke Dashboard</h2>
        
        <div class="error-message" id="error-message">Username atau password salah</div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>
            
            <button type="submit" id="btn-login">
                Masuk <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="hint" id="demo-hint" style="display:none;">
            <strong>Demo Account:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>admin123</code>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Tampilkan/sembunyikan hint Demo Account sesuai setting landing demo
        (async () => {
            try {
                const res = await fetch('/api/public/landing-status');
                if (res.ok) {
                    const data = await res.json();
                    if (data.tampilkan_landing_demo !== false) {
                        document.getElementById('demo-hint').style.display = 'block';
                    }
                }
            } catch (_) {
                // Jika endpoint gagal (offline/etc), sembunyikan hint — fail safe
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');
            const btn = document.getElementById('btn-login');

            btn.innerHTML = 'Memproses...';
            errorEl.style.display = 'none';

            try {
                // Ensure to call the correct API endpoint
                let res, data;
                try {
                    res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    data = await res.json();
                } catch (networkErr) {
                    // Fetch gagal total — server tidak bisa dijangkau sama sekali
                    errorEl.innerHTML = '🔴 <strong>Server tidak dapat dijangkau.</strong><br>'
                        + 'Express.js tidak berjalan atau port tidak terbuka di hosting.<br>'
                        + '<small style="opacity:0.8">Cek: Logs → apakah server berhasil start? Apakah PORT env sudah di-set?</small>';
                    errorEl.style.display = 'block';
                    btn.innerHTML = 'Masuk <i data-lucide="log-in" style="width:18px;height:18px;"></i>';
                    lucide.createIcons();
                    return;
                }

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name || '');
                    window.location.href = 'dashboard.html';
                } else {
                    // Server bisa dijangkau tapi ada error
                    let msg = '';
                    const code = data.error_code || '';
                    if (code === 'DB_CONNECTION_ERROR') {
                        msg = '🟠 <strong>Koneksi database gagal.</strong><br>'
                            + (data.error || '') + '<br>'
                            + '<small style="opacity:0.8">Cek: DB_HOST, DB_USER, DB_PASSWORD, DB_NAME di environment variables hosting.</small>';
                    } else if (code === 'INVALID_CREDENTIALS' || res.status === 401) {
                        msg = '🔑 Username atau password salah.';
                    } else if (code === 'SERVER_ERROR' || res.status === 500) {
                        msg = '🔴 <strong>Server error (500).</strong><br>'
                            + (data.error || 'Terjadi kesalahan internal.') + '<br>'
                            + '<small style="opacity:0.8">Cek server logs di hosting untuk detail error.</small>';
                    } else {
                        msg = data.error || 'Terjadi kesalahan login.';
                    }
                    errorEl.innerHTML = msg;
                    errorEl.style.display = 'block';
                    btn.innerHTML = 'Masuk <i data-lucide="log-in" style="width:18px;height:18px;"></i>';
                    lucide.createIcons();
                }
            } catch (err) {
                console.error(err);
                errorEl.textContent = 'Terjadi kesalahan tidak terduga: ' + err.message;
                errorEl.style.display = 'block';
                btn.innerHTML = 'Masuk <i data-lucide="log-in" style="width:18px;height:18px;"></i>';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
